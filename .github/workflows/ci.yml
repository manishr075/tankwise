name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Engine and API client tests (node --test)
        run: npm test
      - name: Production build
        run: npm run build

  backend:
    name: Backend tests (model and Lambda handler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run tests from backend/ so app and water_balance import
        working-directory: backend
        run: python -m unittest discover -s tests -v

  parity:
    name: Engine parity (engine.js vs water_balance.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compare both engines on the edge cases and 2,000 seeded scenarios
        run: python scripts/check_parity.py

  template:
    name: Template lint (cfn-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install cfn-lint
        run: python -m pip install cfn-lint
      - name: Lint the SAM template
        run: cfn-lint template.yaml
